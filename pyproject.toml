[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interview"
version = "0.1.0"
description = "Unified multi-method requirements elicitation interview environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Runtime & Data Modeling (interview & proposed_method & baselines)
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",

    # LLM SDKs & Token Processing (interviewee agent & all methods)
    "openai>=1.30.0",
    "tiktoken>=0.7.0",

    # Baseline Method Requirements (SparkMe vector search & agent abstractions)
    "numpy>=1.24.0",
    "faiss-cpu>=1.8.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
extra-providers = [
    "langchain-together>=0.2.0",
    "anthropic>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
