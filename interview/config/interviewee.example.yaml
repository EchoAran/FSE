# ==============================================================================
# Interviewee Agent Configuration Example
# ==============================================================================

model:
  # Base URL or Chat Completions endpoint for OpenAI-compatible LLM service
  api_url: "https://api.openai.com/v1/chat/completions"

  # Target model name for interviewee simulation
  model_name: "gpt-4o-mini"

  # Environment variable name containing the API key
  api_key_env: "INTERVIEWEE_API_KEY"

  # Optional explicit API key (prefer using environment variable)
  api_key: ""

  # Sampling temperature (0.0 to 1.0)
  temperature: 0.5

  # Request timeout in seconds
  timeout_seconds: 60.0

  # Maximum retries upon transient errors
  max_retries: 3

# Path to the English prompt template file (defaults to interview/interviewee/prompt.txt if omitted)
prompt_path: "interview/interviewee/prompt.txt"

# Number of recent completed dialogue pairs (interviewer question + stakeholder answer) retained in context
history_window_pairs: 6
