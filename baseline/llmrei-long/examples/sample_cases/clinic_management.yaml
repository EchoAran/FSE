case_id: "CASE-RE-001"
project_name: "Smart Clinic Management System"
initial_requirements: |
  The goal is to develop a cloud-based clinic management system for private practices.
  Key objectives:
  - Online appointment booking and real-time waiting room queue display.
  - Electronic Medical Record (EMR) management for doctor consultations.
  - Prescription management with pharmacy integration.
  - Compliance with patient data privacy regulations (HIPAA/GDPR).
