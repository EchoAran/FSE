case_id: "CASE-RE-002"
project_name: "University Digital Library & Resource Portal"
initial_requirements: |
  A unified digital catalog and lending management system for university students and faculty.
  Key objectives:
  - Search and filter physical books, e-books, journals, and institutional research papers.
  - Automated hold requests, loan renewal, and fine calculation.
  - Integration with campus Single Sign-On (SSO) and student card RFID scanners.
  - Reporting dashboard for librarians regarding resource usage and overdue statistics.
