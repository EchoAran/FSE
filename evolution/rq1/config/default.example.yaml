paths:
  results_root: results
  artifacts_root: evolution/rq1/artifacts

methods:
  - hashimoto
  - llmrei-long
  - sparkme
  - proposed_method

llm:
  api_url: YOUR_ENDPOINT
  model_name: YOUR_MODEL
  api_key: YOUR_API_KEY
  api_key_env: RQ1_LLM_API_KEY
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 3
  concurrency: 4
  deduplication_batch_size: 50

embedding:
  api_url: YOUR_ENDPOINT
  model_name: YOUR_MODEL
  api_key: YOUR_API_KEY
  api_key_env: RQ1_EMBEDDING_API_KEY
  dimensions: 3072
  batch_size: 64
  timeout_seconds: 120

clustering:
  distance_threshold: 0.5
  sensitivity_thresholds: [0.45, 0.55]

elaboration:
  pair_batch_size: 100

audit:
  random_seed: 31017
  case_count: 7

statistics:
  random_seed: 31017
  bootstrap_repeats: 10000
  tokenizer_encoding: cl100k_base
