paths:
  cases_file: evolution/rq3/cases.jsonl
  results_root: results
  artifacts_root: evolution/rq3/artifacts
methods:
  - hashimoto
  - llmrei-long
  - sparkme
  - proposed_method
artifact_processor:
  api_url: YOUR_ENDPOINT
  model_name: YOUR_MODEL
  api_key: YOUR_API_KEY
  timeout_seconds: 120
coding:
  api_url: YOUR_API_BASE  # e.g. https://api.example.com/v1; omit /chat/completions
  model_name: openai/YOUR_MODEL
  api_key: YOUR_API_KEY
  agent_python: evolution/rq3/.venv-agent/Scripts/python.exe
  image: rq3-coding
  runs_per_srs: 5
  step_limit: YOUR_POSITIVE_INTEGER
  wall_time_seconds: YOUR_POSITIVE_INTEGER
  cost_limit: YOUR_POSITIVE_NUMBER
  command_timeout_seconds: 60
  network: none
  concurrency: 1
implementation_evaluator:
  api_url: YOUR_ENDPOINT
  model_name: YOUR_MODEL
  api_key: YOUR_API_KEY
  timeout_seconds: 120