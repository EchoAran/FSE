{% extends 'base.html' %}
{% block content %}
<h2>Admin</h2>
<p>Progress records: {{ progress_count }}</p>
<form method="post">
  <input type="hidden" name="action" value="settings">
  <label>Board title <input type="text" name="board_title" value="{{ settings.board_title }}"></label><br>
  <label><input type="checkbox" name="beginner_mode" value="1" {% if settings.beginner_mode == '1' %}checked{% endif %}> Beginner mode</label><br>
  <button type="submit">Save settings</button>
</form>
<hr>
<form method="post">
  <input type="hidden" name="action" value="clear_progress">
  <button type="submit">Clear progress</button>
</form>
<form method="post">
  <input type="hidden" name="action" value="archive_progress">
  <button type="submit">Archive and clear progress</button>
</form>
<hr>
<h3>Add puzzle</h3>
<form method="post">
  <input type="hidden" name="action" value="add_puzzle">
  <label>Name <input name="name" value="New Puzzle"></label><br>
  <label>Rows <input type="number" name="rows" value="3"></label><br>
  <label>Cols <input type="number" name="cols" value="3"></label><br>
  <label>Difficulty <input type="number" name="difficulty" value="1"></label><br>
  <label><input type="checkbox" name="beginners" value="1" checked> Beginner puzzle</label><br>
  <label>Goal JSON<textarea name="goal_json">{"1":[0,0],"2":[1,0]}</textarea></label><br>
  <label>Start JSON<textarea name="start_json">{"1":[1,1],"2":[2,2]}</textarea></label><br>
  <button type="submit">Add puzzle</button>
</form>
<hr>
<h3>Puzzles</h3>
<ul>
{% for p in puzzles %}
  <li>
    {{ p.id }}: {{ p.name }} {% if p.active %}(active){% else %}(inactive){% endif %}
    <form method="post" style="display:inline">
      <input type="hidden" name="action" value="toggle">
      <input type="hidden" name="puzzle_id" value="{{ p.id }}">
      <input type="hidden" name="active" value="{{ p.active }}">
      <button type="submit">Toggle</button>
    </form>
  </li>
{% endfor %}
</ul>
{% endblock %}
