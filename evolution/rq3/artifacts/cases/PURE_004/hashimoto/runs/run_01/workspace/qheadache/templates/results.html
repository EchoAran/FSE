{% extends 'base.html' %}
{% block content %}
<h2>Results</h2>
<table border="1" cellpadding="6">
<tr><th>Player</th><th>Puzzle</th><th>Moves</th><th>Seconds</th><th>Score</th><th>Completed</th></tr>
{% for r in rows %}
<tr><td>{{ r.player }}</td><td>{{ r.puzzle_id }}</td><td>{{ r.moves }}</td><td>{{ '%.0f'|format(r.elapsed_seconds) }}</td><td>{{ r.score }}</td><td>{{ r.completed_at }}</td></tr>
{% endfor %}
</table>
{% endblock %}
