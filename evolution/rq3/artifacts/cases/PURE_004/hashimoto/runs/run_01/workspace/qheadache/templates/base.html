<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Qheadache</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .board { display: grid; gap: 6px; margin: 16px 0; }
    .cell, .tile { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
    .tile { background: #d9ecff; cursor: pointer; }
    .empty { background: #f7f7f7; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .msg { padding: 8px 12px; background: #fff3cd; margin: 8px 0; }
    textarea { width: 100%; height: 100px; }
    input[type=text], input[type=number] { width: 100%; }
  </style>
</head>
<body>
  <h1><a href="/">Qheadache</a></h1>
  {% for message in get_flashed_messages() %}
    <div class="msg">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
