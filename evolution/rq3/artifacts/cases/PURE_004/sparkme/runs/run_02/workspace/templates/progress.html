<!doctype html><html><head><title>Progress</title></head><body>
<h1>Progress / Stats</h1>
<p>Completed: {{ 1 if state.status == 'completed' else 0 }}</p>
<p>Current time: {{ state.started_at }}</p>
<p>Moves made: {{ state.moves }}</p>
<p>Best result: {{ state.score }}</p>
<form method="post" action="/export"><button name="detailed" value="0">Export basic stats</button><button name="detailed" value="1">Export detailed stats</button></form>
<p><a href="/">Back to game</a></p>
</body></html>
