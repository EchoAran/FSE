<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qheadache</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <h1>Qheadache</h1>
      <p class="subtitle">Move the blue block to the goal. Click or drag tiles in the indicated direction.</p>
    </header>

    <section class="status-panel" aria-live="polite">
      <div><strong>Time:</strong> <span id="time">0:00</span></div>
      <div><strong>Moves:</strong> <span id="moves">0</span></div>
      <div><strong>Score:</strong> <span id="score">0</span></div>
      <div><strong>State:</strong> <span id="state">In progress</span></div>
    </section>

    <section class="controls">
      <button id="resetBtn">Reset / Replay</button>
      <button id="clearBtn" title="Clear saved progress for this puzzle">Clear Saved Progress</button>
    </section>

    <section id="message" class="message" aria-live="polite"></section>

    <section id="board" class="board" aria-label="Puzzle board"></section>

    <section class="history">
      <h2>Best local results</h2>
      <ul id="historyList"></ul>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
