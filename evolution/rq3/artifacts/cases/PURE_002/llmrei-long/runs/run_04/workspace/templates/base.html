<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAMMA-J Web Store</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
    nav a { margin-right: 12px; }
    .card { border: 1px solid #ccc; padding: 12px; margin: 12px 0; }
    img { max-width: 180px; }
    .flash { background: #eef; padding: 10px; margin: 10px 0; }
    label { display:block; margin-top:8px; }
    input, textarea { width: 100%; padding: 8px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>
  <h1>GAMMA-J Web Store</h1>
  <nav>
    <a href="/">Browse</a>
    <a href="/cart">Cart</a>
    <a href="/checkout">Checkout</a>
    <a href="/orders">My Orders</a>
    <a href="/account">My Account</a>
    <a href="/staff/products">Staff Products</a>
    <a href="/staff/customers">Staff Customers</a>
    <a href="/staff/reports">Staff Reports</a>
  </nav>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
