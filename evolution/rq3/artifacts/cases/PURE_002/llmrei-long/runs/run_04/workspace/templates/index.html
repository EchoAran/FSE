{% extends 'base.html' %}{% block content %}
<form method="get">
  <input name="q" placeholder="Search by name" value="{{ filters.get('q', '') }}">
  <input name="min_price" placeholder="Min price" value="{{ filters.get('min_price', '') }}">
  <input name="max_price" placeholder="Max price" value="{{ filters.get('max_price', '') }}">
  <select name="category">
    <option value="">All categories</option>
    {% for c in categories %}<option value="{{ c }}" {% if filters.get('category') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>
{% for p in products %}
<div class="card">
  <h3>{{ p.name }}</h3>
  <p>{{ p.description }}</p>
  <p>Price: ${{ '%.2f'|format(p.price) }}</p>
  <p>Availability: {{ p.availability }}</p>
  {% if p.image %}<img src="{{ p.image }}" alt="{{ p.name }}">{% endif %}
  <form method="post" action="/cart/add/{{ p.id }}"><button>Add to cart</button></form>
</div>
{% endfor %}
{% endblock %}
