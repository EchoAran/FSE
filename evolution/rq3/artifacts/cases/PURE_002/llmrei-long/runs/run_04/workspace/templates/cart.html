{% extends 'base.html' %}{% block content %}
<h2>Shopping Cart</h2>
{% if items %}
<table>
<tr><th>Product</th><th>Qty</th><th>Subtotal</th><th>Actions</th></tr>
{% for item in items %}
<tr>
<td>{{ item.product.name }}</td>
<td>
  <form method="post" action="/cart/update/{{ item.product.id }}">
    <input type="number" name="qty" value="{{ item.qty }}" min="0">
    <button>Update</button>
  </form>
</td>
<td>${{ '%.2f'|format(item.subtotal) }}</td>
<td><form method="post" action="/cart/remove/{{ item.product.id }}"><button>Remove</button></form></td>
</tr>
{% endfor %}
</table>
<p><strong>Total: ${{ '%.2f'|format(total) }}</strong></p>
{% else %}<p>Cart is empty.</p>{% endif %}
{% endblock %}
