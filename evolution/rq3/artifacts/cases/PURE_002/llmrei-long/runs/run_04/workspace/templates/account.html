{% extends 'base.html' %}{% block content %}
<h2>My Account</h2>
<form method="post">
  <label>Name<input name="name" value="{{ customer.name }}"></label>
  <label>Email<input name="email" value="{{ customer.email }}"></label>
  <label>Phone<input name="phone" value="{{ customer.phone }}"></label>
  <label>Address<textarea name="address">{{ customer.address }}</textarea></label>
  <button>Save</button>
</form>
{% endblock %}
