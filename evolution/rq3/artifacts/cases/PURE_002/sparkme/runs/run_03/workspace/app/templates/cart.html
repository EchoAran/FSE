{% extends 'base.html' %}{% block content %}
<h1>Cart</h1>
<table><tr><th>Product</th><th>Qty</th><th>Price</th></tr>{% for i in store.cart %}<tr><td>{{ i.name }}</td><td>{{ i.qty }}</td><td>{{ i.price }}</td></tr>{% endfor %}</table>
<h2>Add to cart</h2>
<form method="post"><select name="product_id">{% for p in store.products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select><input name="qty" value="1"><button>Add</button></form>
{% endblock %}
