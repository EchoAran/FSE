{% extends 'base.html' %}{% block content %}
<h1>Setup</h1>
<p>Step 1 of 4: Basic store information</p>
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% if errors %}<div class="err">{{ errors|join(' ') }}</div>{% endif %}
<form method="post"><label>Store name <input name="name" value="{{ store.store_info.name }}"></label><br><label>Currency <input name="currency" value="{{ store.store_info.currency }}"></label><br><button>Save</button></form>
{% endblock %}
