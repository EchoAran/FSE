{% extends 'base.html' %}{% block content %}
<h1>Products</h1>
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
<table><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Category</th></tr>{% for p in store.products %}<tr><td>{{ p.name }}</td><td>{{ p.sku }}</td><td>{{ p.price }}</td><td>{{ p.stock }}</td><td>{{ p.category }}</td></tr>{% endfor %}</table>
<h2>Add product</h2>
<form method="post"><input name="name" placeholder="Name"><input name="sku" placeholder="SKU"><input name="price" placeholder="Price"><input name="stock" placeholder="Stock"><input name="category" placeholder="Category"><input name="description" placeholder="Description"><button>Add</button></form>
{% endblock %}
