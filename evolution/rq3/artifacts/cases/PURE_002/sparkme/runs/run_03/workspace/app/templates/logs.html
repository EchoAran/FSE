{% extends 'base.html' %}{% block content %}<h1>Change log</h1><p>Who changed what and when.</p><table><tr><th>Time</th><th>Actor</th><th>Entity</th><th>Action</th><th>Reason</th></tr>{% for l in store.logs %}<tr><td>{{ l.time }}</td><td>{{ l.actor }}</td><td>{{ l.entity }}</td><td>{{ l.action }}</td><td>{{ l.reason }}</td></tr>{% endfor %}</table>{% endblock %}
