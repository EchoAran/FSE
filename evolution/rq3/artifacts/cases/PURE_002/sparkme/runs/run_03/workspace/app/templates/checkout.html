{% extends 'base.html' %}{% block content %}
<h1>Checkout</h1>
{% if feedback %}<div class="msg">{{ feedback|join(' ') }}</div>{% endif %}
<p>Validation checks required customer, shipping, and payment info before submission.</p>
<form method="post"><input name="customer_name" placeholder="Customer name"><input name="address" placeholder="Shipping address"><input name="payment" placeholder="Payment reference"><button>Submit order</button></form>
{% endblock %}
