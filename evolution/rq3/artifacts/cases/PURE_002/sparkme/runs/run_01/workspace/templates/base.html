<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAMMA-J Web Store</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1100px;margin:0 auto;padding:20px;line-height:1.4}
    nav a{margin-right:12px}
    .card{border:1px solid #ddd;padding:16px;margin:12px 0;border-radius:8px}
    .error{color:#b00020}
    .ok{color:#0a7}
    table{width:100%;border-collapse:collapse} th,td{border:1px solid #ddd;padding:8px;text-align:left}
    input,textarea{width:100%;padding:8px;margin:4px 0 12px 0;box-sizing:border-box}
    button{padding:8px 12px}
  </style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/setup">Setup</a>
  <a href="/products">Products</a>
  <a href="/cart">Cart</a>
  <a href="/checkout">Checkout</a>
  <a href="/orders">Orders</a>
  <a href="/import">Import</a>
  <a href="/logs">Logs</a>
  <a href="/notifications">Notifications</a>
</nav>
<hr>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}<p class="ok">{{ message }}</p>{% endfor %}
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
