{% extends 'base.html' %}{% block content %}
<div class="card">
<h2>Products</h2>
<table><tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Category</th><th>Status</th><th>Actions</th></tr>
{% for p in products %}
<tr>
<td>{{ p.name }}</td><td>{{ p.sku }}</td><td>${{ '%.2f'|format(p.price) }}</td><td>{{ p.stock }}</td><td>{{ p.category }}</td><td>{{ 'Available' if p.available else 'Unavailable' }}</td>
<td><form method="post" action="/product/{{ p.id }}/toggle"><button type="submit">Toggle availability</button></form><form method="post" action="/cart/add/{{ p.id }}"><button type="submit">Add to cart</button></form></td>
</tr>{% endfor %}</table>
</div>
{% endblock %}
