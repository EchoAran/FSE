{% extends 'base.html' %}{% block content %}
<div class="card"><h2>Checkout</h2>{% if errors %}<ul class="error">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
<form method="post"><label>Name</label><input name="name"><label>Email</label><input name="email"><label>Address</label><input name="address"><label>Payment info</label><input name="payment" placeholder="1234 5678 9012 3456"><button>Place order</button></form>
<p><strong>Order total:</strong> ${{ '%.2f'|format(total) }}</p></div>{% endblock %}
