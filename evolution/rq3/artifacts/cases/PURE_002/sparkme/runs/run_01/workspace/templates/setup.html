{% extends 'base.html' %}{% block content %}
<div class="card">
  <h2>Guided setup - Step {{ step }} of 3</h2>
  {% if errors %}<ul class="error">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  {% if step == 1 %}
  <form method="post"><input type="hidden" name="step" value="1"><label>Store name</label><input name="name" placeholder="Example Store"><button>Continue</button></form>
  {% elif step == 2 %}
  <form method="post"><input type="hidden" name="step" value="2"><label>Category</label><input name="category" placeholder="Apparel"><button>Continue</button></form>
  {% else %}
  <form method="post"><input type="hidden" name="step" value="3"><p>Review store info and finish setup.</p><button>Finish setup</button></form>
  {% endif %}
</div>
{% endblock %}
