{% extends 'base.html' %}{% block content %}
<div class="card"><h2>Cart</h2>{% if cart %}<ul>{% for i in cart %}<li>{{ i.name }} x {{ i.qty }} - ${{ '%.2f'|format(i.price * i.qty) }}</li>{% endfor %}</ul><p><strong>Total:</strong> ${{ '%.2f'|format(total) }}</p>{% else %}<p>Your cart is empty.</p>{% endif %}</div>
{% endblock %}
