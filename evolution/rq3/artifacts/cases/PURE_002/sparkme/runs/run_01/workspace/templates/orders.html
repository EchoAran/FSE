{% extends 'base.html' %}{% block content %}
<div class="card"><h2>Orders</h2>{% if orders %}<table><tr><th>ID</th><th>Customer</th><th>Payment</th><th>Shipping</th><th>Total</th></tr>{% for o in orders %}<tr><td>{{ o.id }}</td><td>{{ o.customer }}</td><td>{{ o.payment_status }}</td><td>{{ o.shipping_status }}</td><td>${{ '%.2f'|format(o.total) }}</td></tr>{% endfor %}</table>{% else %}<p>No orders yet.</p>{% endif %}</div>
{% endblock %}
