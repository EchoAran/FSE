<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAMMA-J Web Store</title>
</head>
<body>
  <header>
    <h1><a href="/">GAMMA-J Web Store</a></h1>
    <nav>
      <a href="/cart">Cart ({{ current_cart_count }})</a> |
      <a href="/admin">Admin</a>
    </nav>
    {% if not catalog_ready %}<p><strong>Catalog not yet marked ready for customers.</strong></p>{% endif %}
  </header>
  {% for message in get_flashed_messages() %}
    <p><strong>{{ message }}</strong></p>
  {% endfor %}
  {% block body %}{% endblock %}
</body>
</html>
