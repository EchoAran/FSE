{% extends "base.html" %}
{% block body %}
<h2>Cart</h2>
<ul>
{% for item in items %}
  <li>{{ item.product.name }} x {{ item.qty }} = ${{ '%.2f'|format(item.line_total) }}</li>
{% else %}
  <li>Cart is empty</li>
{% endfor %}
</ul>
<p>Total: ${{ '%.2f'|format(total) }}</p>
<form method="post" action="/checkout">
  <label>Shipping address <input name="shipping_address"></label><br>
  <label>Email <input name="email"></label><br>
  <label>Payment method <input name="payment_method" value="trusted-provider"></label><br>
  <button type="submit">Checkout</button>
</form>
{% endblock %}
