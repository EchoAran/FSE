{% extends 'base.html' %}{% block content %}<h1>Children</h1><form method="post"><select name="family_id">{% for f in families %}<option value="{{f.id}}">{{f.name}}</option>{% endfor %}</select><input name="name" placeholder="Child name" required><input name="allergy_notes" placeholder="Allergies"><input name="immunizations" placeholder="Immunizations"><button>Add child</button></form><ul>{% for c in children %}<li>#{{c.id}} {{c.name}} (family {{c.family_id}})</li>{% endfor %}</ul>{% endblock %}
