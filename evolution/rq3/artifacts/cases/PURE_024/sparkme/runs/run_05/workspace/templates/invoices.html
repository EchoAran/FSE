{% extends 'base.html' %}{% block content %}<h1>Invoices</h1><form method="post"><select name="family_id">{% for f in families %}<option value="{{f.id}}">{{f.name}}</option>{% endfor %}</select><select name="child_id"><option value="">-- optional child --</option>{% for c in children %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="amount" type="number" step="0.01" placeholder="Amount" required><button>Create invoice</button></form><ul>{% for i in invoices %}<li>#{{i.id}} ${{'%.2f'|format(i.amount)}} status={{i.status}} payment={{i.payment_state}} <form method="post" action="/invoices/{{i.id}}/pay" style="display:inline"><button>Mark paid</button></form></li>{% endfor %}</ul>{% endblock %}
