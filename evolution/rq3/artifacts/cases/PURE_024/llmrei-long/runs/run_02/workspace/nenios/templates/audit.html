{% extends 'base.html' %}
{% block content %}
<h1>Audit trail</h1>
<table>
  <tr><th>Timestamp</th><th>Role</th><th>Action</th><th>Target</th><th>Details</th></tr>
  {% for entry in audit %}
  <tr><td>{{ entry.timestamp }}</td><td>{{ entry.user_role }}</td><td>{{ entry.action }}</td><td>{{ entry.target }}</td><td>{{ entry.details }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
