{% extends 'base.html' %}
{% block content %}
<h1>Health reminders</h1>
<table>
  <tr><th>Child</th><th>Health info</th><th>Immunization</th></tr>
  {% for child in reminders %}
  <tr><td>{{ child.name }}</td><td>{{ child.health_info or 'Missing' }}</td><td>{{ child.immunization_status }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
