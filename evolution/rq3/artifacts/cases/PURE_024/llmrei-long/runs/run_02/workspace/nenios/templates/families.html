{% extends 'base.html' %}
{% block content %}
<h1>Families</h1>
<table>
  <tr><th>Family</th><th>Contacts</th><th>Children</th></tr>
  {% for fam in families %}
  <tr>
    <td>{{ fam.name }}</td>
    <td>{{ fam.contacts|join(', ') }}</td>
    <td>{% for child in children if child.family_id == fam.id %}{{ child.name }} ({{ child.status }})<br>{% endfor %}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
