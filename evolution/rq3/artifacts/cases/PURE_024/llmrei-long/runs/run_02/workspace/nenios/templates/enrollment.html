{% extends 'base.html' %}
{% block content %}
<h1>Enrollment</h1>
<table>
  <tr><th>Child</th><th>Status</th><th>Age group</th><th>Waiting position</th><th>Action</th></tr>
  {% for child in children %}
  <tr>
    <td>{{ child.name }}</td><td>{{ child.status }}</td><td>{{ child.age_group }}</td><td>{{ child.waiting_position or '' }}</td>
    <td>
      {% if child.status != 'enrolled' %}
      <form method="post" action="/promote/{{ child.id }}?role={{ role }}"><button>Promote</button></form>
      {% endif %}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
