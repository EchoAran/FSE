{% extends 'base.html' %}{% block body %}
<h1>{{ artifact.title }}</h1>
<div class="card"><div>Type: {{ artifact.type }}</div><div>Status: {{ artifact.status }}</div><div>Lifecycle: {{ artifact.lifecycle }}</div><div>Version: {{ artifact.version }}</div><div>{% if artifact.archived %}<strong class="warn">Archived</strong>{% endif %}</div></div>
<form method="post" action="/artifact/save" class="card"><input type="hidden" name="id" value="{{ artifact.id }}"><input type="hidden" name="version" value="{{ artifact.version }}"><label>Title <input name="title" value="{{ artifact.title }}"></label><br><label>Content <textarea name="content">{{ artifact.content }}</textarea></label><br><label>Rationale <textarea name="rationale">{{ artifact.rationale }}</textarea></label><br><label>Source notes <textarea name="source_notes">{{ artifact.source_notes }}</textarea></label><br><label>Assumptions <textarea name="assumptions">{{ artifact.assumptions }}</textarea></label><br><label>Status <input name="status" value="{{ artifact.status }}"></label><br><label>Lifecycle <input name="lifecycle" value="{{ artifact.lifecycle }}"></label><br><label>Archived <input name="archived" value="{{ artifact.archived }}"></label><br><button>Save</button></form>
{% endblock %}
